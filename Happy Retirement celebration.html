<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Celebration - 3D Interactive Experience</title>
    <!-- Tailwind CSS for UI Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');
        
        :root {
            --gold: #d4af37;
            --gold-light: #fde68a;
        }

        body {
            margin: 0;
            background-color: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .gold-gradient {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            cursor: pointer;
        }

        .action-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        .fade-up {
            animation: fadeUp 1s ease-out forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        canvas { touch-action: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Core Dependencies: Babel for JSX, React, Three.js -->
    <!-- 使用 crossorigin 确保在 GitHub Pages 上的加载权限 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "three": "https://esm.sh/three@0.160.0",
                "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
                "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1?external=react,react-dom,three,@react-three/fiber"
            }
        }
    </script>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import * as THREE from 'three';
        import { Canvas, useFrame } from '@react-three/fiber';
        import { 
            OrbitControls, 
            Text, 
            Float, 
            ContactShadows, 
            Environment, 
            PerspectiveCamera, 
            Center,
            Sparkles
        } from '@react-three/drei';

        // --- 1. Smoke Particle Effect ---
        const SmokeParticles = ({ position }) => {
            const group = useRef();
            const count = 12;
            const particles = useMemo(() => {
                return Array.from({ length: count }).map(() => ({
                    offset: Math.random() * Math.PI,
                    speed: 0.008 + Math.random() * 0.01,
                    x: (Math.random() - 0.5) * 0.1,
                    scale: 0.5 + Math.random()
                }));
            }, []);

            useFrame((state) => {
                if (group.current) {
                    group.current.children.forEach((child, i) => {
                        const p = particles[i];
                        const t = (state.clock.elapsedTime * p.speed * 100 + p.offset) % 2;
                        child.position.y = t;
                        child.position.x = p.x + Math.sin(t * 3) * 0.05;
                        child.scale.setScalar((1 - t/2) * p.scale);
                        child.material.opacity = (1 - t/2) * 0.5;
                    });
                }
            });

            return (
                <group ref={group} position={position}>
                    {particles.map((_, i) => (
                        <mesh key={i}>
                            <sphereGeometry args={[0.08, 8, 8]} />
                            <meshBasicMaterial color="#d1d5db" transparent opacity={0} />
                        </mesh>
                    ))}
                </group>
            );
        };

        // --- 2. Interactive Candle Component ---
        const Candle = ({ status }) => {
            const flameRef = useRef();
            const isOff = status === 'BLOWING' || status === 'FINISHED';

            useFrame((state) => {
                if (flameRef.current) {
                    if (!isOff) {
                        const s = 1 + Math.sin(state.clock.elapsedTime * 15) * 0.1;
                        flameRef.current.scale.set(s, s * 1.3, s);
                        flameRef.current.position.y = 0.75 + Math.sin(state.clock.elapsedTime * 10) * 0.01;
                    } else {
                        flameRef.current.scale.lerp(new THREE.Vector3(0, 0, 0), 0.1);
                    }
                }
            });

            return (
                <group position={[0, 0.6, 0]}>
                    <mesh castShadow>
                        <cylinderGeometry args={[0.08, 0.1, 1.2, 24]} />
                        <meshStandardMaterial color="#be123c" roughness={0.3} />
                    </mesh>

                    <mesh ref={flameRef} position={[0, 0.75, 0]}>
                        <sphereGeometry args={[0.12, 16, 16]} />
                        <meshStandardMaterial 
                            color="#fbbf24" 
                            emissive="#f59e0b" 
                            emissiveIntensity={4} 
                        />
                        <pointLight intensity={isOff ? 0 : 3} distance={5} color="#fbbf24" />
                    </mesh>

                    {isOff && <SmokeParticles position={[0, 0.8, 0]} />}
                </group>
            );
        };

        // --- 3. Main Scene Construction ---
        function App() {
            const [page, setPage] = useState('LANDING'); 
            const [status, setStatus] = useState('WAITING'); 

            const handleAction = () => {
                setStatus('BLOWING');
                setTimeout(() => setStatus('FINISHED'), 1200);
            };

            if (page === 'LANDING') {
                return (
                    <div className="flex flex-col items-center justify-center w-full h-screen p-4">
                        <div className="glass-card max-w-lg w-full p-12 text-center rounded-3xl fade-up">
                            <span className="text-7xl mb-6 block animate-bounce">🍾</span>
                            <h1 className="gold-gradient text-5xl font-bold mb-4 tracking-tight">
                                Happy Retirement
                            </h1>
                            <div className="w-20 h-1 bg-amber-500 mx-auto mb-8 rounded-full"></div>
                            <p className="text-gray-400 text-lg mb-10 font-light">
                                Honoring your brilliant past and welcoming your golden future.<br/>
                                Your exclusive party is waiting.
                            </p>
                            <button 
                                onClick={() => setPage('INTERACTIVE')}
                                className="action-btn w-full py-5 rounded-2xl uppercase tracking-widest text-sm"
                            >
                                Start Celebration
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative w-full h-screen">
                    <Canvas shadows dpr={[1, 2]} gl={{ antialias: true }}>
                        <PerspectiveCamera makeDefault position={[0, 3, 8]} fov={35} />
                        <color attach="background" args={['#050505']} />
                        
                        <ambientLight intensity={0.5} />
                        <spotLight position={[5, 10, 5]} angle={0.2} penumbra={1} castShadow intensity={1.5} />
                        <Environment preset="city" />

                        <Float speed={2} rotationIntensity={0.5} floatIntensity={0.5}>
                            <Center position={[0, 3.5, -2]}>
                                <Text
                                    fontSize={0.7}
                                    color="#d4af37"
                                    font="https://fonts.gstatic.com/s/playfairdisplay/v30/nuFvD7K_ruXBaDb7t3r1WvRxaHrv.woff"
                                >
                                    New Journey Begins
                                </Text>
                            </Center>
                        </Float>

                        <group position={[0, -0.5, 0]}>
                            <mesh castShadow position={[0, 0, 0]}>
                                <cylinderGeometry args={[1.6, 1.7, 0.8, 64]} />
                                <meshStandardMaterial color="#fffbeb" />
                            </mesh>
                            <mesh position={[0, 0.45, 0]}>
                                <cylinderGeometry args={[1.62, 1.62, 0.1, 64]} />
                                <meshStandardMaterial color="white" />
                            </mesh>
                            <Candle status={status} />
                            <Sparkles count={50} scale={5} size={2} speed={0.5} color="#fcd34d" />
                        </group>

                        <ContactShadows position={[0, -1, 0]} opacity={0.4} scale={15} blur={2} far={4} />
                        <OrbitControls enablePan={false} minDistance={5} maxDistance={11} maxPolarAngle={Math.PI / 2.2} />
                    </Canvas>

                    <div className="absolute inset-x-0 bottom-16 flex justify-center px-6">
                        {status === 'WAITING' && (
                            <button 
                                onClick={handleAction}
                                className="action-btn px-12 py-5 rounded-full flex items-center gap-4 shadow-2xl"
                            >
                                <span className="text-2xl animate-pulse">🌬️</span>
                                <span>Make a Wish & Blow</span>
                            </button>
                        )}

                        {status === 'FINISHED' && (
                            <div className="glass-card px-10 py-8 rounded-3xl text-center fade-up">
                                <h2 className="text-3xl font-bold gold-gradient mb-2">Congratulations! ✨</h2>
                                <p className="text-gray-400 mb-6">May your retirement be as brilliant as the stars.</p>
                                <button 
                                    onClick={() => window.location.reload()}
                                    className="text-amber-500 text-xs hover:text-white transition-colors"
                                >
                                    RESTART CELEBRATION
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
